# =============================================================================
# Glasscalibur - StallGuard, the vibration stall check, the stall response, auto-tune
# =============================================================================
# A local package merged by firmware/glasscalibur.yaml. Its items moved
# verbatim from the former single product file.
#
# Stall-detector interlock: at least one of the two detectors is always on.
# Switching StallGuard Enabled off while Vibration Stall Detection is off is
# refused (it switches straight back on, logged at WARN), and so is switching
# vibration off while StallGuard is off, from any interface. Both switches
# restore from flash before the interlock arms (on_boot 490); if both were
# stored off, StallGuard is turned on there. Calibration turns vibration on
# before it turns StallGuard off.
# =============================================================================

esphome:
  on_boot:
    # After the switches' restore (template switches set up at priority 798):
    # repair a stored "both off", then arm the interlock.
    - priority: 490
      then:
        - if:
            condition:
              lambda: 'return !id(stallguard_enabled).state && !id(vib_enabled).state;'
            then:
              - logger.log:
                  level: WARN
                  format: "Both stall detectors were off - StallGuard turned on (one must stay on)"
              - switch.turn_on: stallguard_enabled
        - globals.set:
            id: stall_interlock_armed
            value: 'true'

globals:

  # Set by on_boot 490 once both detector switches have restored; until then
  # the interlock below does not act.
  - id: stall_interlock_armed
    type: bool
    restore_value: no
    initial_value: 'false'

  # --- Vibration-based stall (secondary to StallGuard) ---
  # A stalled stepper shakes the device hard. While the motor is commanded to
  # move, we run a leaky counter on vibration-above-threshold samples; crossing
  # vib_stall_samples declares a stall. Leaky (rather than consecutive-reset)
  # so a single quiet sample mid-stall doesn't restart the count from zero.
  - id: vib_loud_count
    type: int
    restore_value: no
    initial_value: '0'

  # --- Lifetime diagnostic counters (persisted) ---
  # Incremented each time the respective event fires. Useful for spotting a
  # unit that's stalling more than its peers, or detecting tamper attempts
  # that happened while the owner wasn't watching HA. Written to flash via
  # NVS batching so they're not free-running flash writers.
  - id: stallguard_count
    type: int
    restore_value: yes
    initial_value: '0'
  - id: vib_stall_count
    type: int
    restore_value: yes
    initial_value: '0'

  # Stall auto-release handshake. One back-off per stall event: set when a
  # back-off starts and held until it ends (the completion poll, motion_halt,
  # or the next user move clears it). A second stall while it is set just
  # stops (jammed solid — don't oscillate).
  - id: stall_release_active
    type: bool
    restore_value: no
    initial_value: 'false'

  # --- StallGuard auto-tune (self-healing SGTHRS) state ---
  # Peak vibration (g) seen during the current travel; reset at motion start,
  # maxed in the vibration interval. It is the cross-check for whether a StallGuard
  # trip was a real (shaky) stall or a quiet false trip.
  - id: vib_run_peak
    type: float
    restore_value: no
    initial_value: '0.0'
  # Set true when the StallGuard handler fires during the current travel; reset at
  # motion start. Lets the vibration detector tell "StallGuard also caught this"
  # from "StallGuard missed a real stall".
  - id: sg_fired_this_move
    type: bool
    restore_value: no
    initial_value: 'false'
  # Consecutive quiet mid-travel StallGuard trips. A single quiet trip is weak
  # evidence (the accelerometer can miss a fast stall), so auto-tune only lowers
  # SGTHRS after a run of them. Reset by vibration agreement or a clean full
  # travel. Not persisted — a fresh boot re-earns the evidence.
  - id: sg_quiet_streak
    type: int
    restore_value: no
    initial_value: '0'
  # Lifetime count of auto-tune adjustments (persisted, surfaced as a diagnostic).
  - id: sg_autotune_count
    type: int
    restore_value: yes
    initial_value: '0'

# -----------------------------------------------------------------------------
# Stepper driver — product on_stall override
# -----------------------------------------------------------------------------
# The driver (id: driver), its UART, and all hardware params (rsense 220 mOhm,
# vsense off, deceleration inf, config_dump off, enn/index/diag pins) come from
# core, fed by the board wrapper's stepper_* substitutions. Only the stall
# response is product-specific. Replace core's default on_stall: because package
# !extend APPENDS to action lists (it does not replace), first !remove core's
# handler — otherwise core's stop + report_position(0) would still run and zero
# the position, which limit-switch homing (not stalls) owns here — then re-add
# the Glasscalibur handler.
stepper:
  - id: !extend driver
    on_stall: !remove
  - id: !extend driver
    on_stall:
      # Software gate on the "StallGuard Enabled" switch — the chip itself
      # always flags stalls; we only react when the user has opted in. When
      # the switch is off, the trigger fires harmlessly with no effect.
      # (During auto-calibration the switch is off, so calibration probes
      # never enter this handler — the script does its own recovery.)
      - if:
          condition:
            lambda: 'return id(stallguard_enabled).state;'
          then:
            - stepper.stop: driver
            - lambda: 'id(stallguard_count) += 1;'
            - logger.log: "MOTOR STALLED (StallGuard)"
            # Back-off and state handling: stall_response (shared with the
            # vibration-stall check).
            - script.execute: stall_response
            # Record the fire and, if auto-tune is on, cross-check vibration to
            # decide whether this was a real stall or a false trip (see the
            # sg_autotune_eval script). Runs last so global_state/position are set.
            - script.execute: sg_autotune_eval

    # NOTE: on_opening / on_opened / on_closing / on_closed used to be wired
    # here, each re-publishing the same current_operation they fired on. That
    # made the trigger recurse into itself indefinitely and stack-overflow
    # within milliseconds of a cover.open / cover.close. The open_action /
    # close_action / position_action / stop_action above already publish
    # OPENING / CLOSING / IDLE, and the 200 ms motion-completion poll flips
    # back to IDLE on target arrival, so these handlers are not needed at all.

# -----------------------------------------------------------------------------
# Obstruction event
# -----------------------------------------------------------------------------
# Fires "obstructed" each time a stall stops a motion outside calibration,
# whichever detector caught it (StallGuard or the vibration check). Home
# Assistant automations can trigger on it directly; the trip counters below
# only refresh every 30 s. It needs a stall detector switched on: StallGuard
# ships ON; Vibration Stall Detection ships OFF until an auto-calibration
# enables it.
event:
  - platform: template
    name: "Obstruction"
    id: obstruction_event
    event_types: ["obstructed"]
    web_server:
      sorting_weight: 5
      sorting_group_id: group_control

number:

  # TCOOLTHRS + SGTHRS are TMC2209 StallGuard registers -> the advanced group at
  # the bottom of the page (they are tuning knobs for StallGuard, not everyday
  # controls). Core defines them in its group_stallguard, which is left empty.
  - id: !extend num_tcoolthrs
    web_server: { sorting_weight: 3, sorting_group_id: group_sg_adv }
  - id: !extend num_sgthrs
    web_server: { sorting_weight: 2, sorting_group_id: group_sg_adv }

# --- Vibration stall threshold (g) ---
# |magnitude - 1g| above which a sample is counted as "loud". A stalled stepper
# shakes the device hard (well above smooth running). Tune by watching the
# accel sensors during a normal move vs. a deliberately stalled one and pick
# a value comfortably between the two.
  - platform: template
    name: "Vibration Threshold"
    id: vib_threshold
    web_server:
      sorting_weight: 2
      sorting_group_id: group_stall
    step: 0.05
    min_value: 0.05
    max_value: 4.0
    mode: BOX
    entity_category: CONFIG
    unit_of_measurement: "g"
    optimistic: true
    restore_value: true
    initial_value: 0.30

# --- Vibration stall debounce (distinct accelerometer samples) ---
# Number of net "loud" samples before declaring a stall. The detector counts
# each fresh LIS2DH12 reading once (the sensor publishes every 500 ms), so
# 5 samples ≈ 2.5 s of sustained strong vibration. A single jolt or one noisy
# bump doesn't trip; sustained motor judder does.
  - platform: template
    name: "Vibration Stall Samples"
    id: vib_stall_samples
    web_server:
      sorting_weight: 3
      sorting_group_id: group_stall
    step: 1
    min_value: 2
    max_value: 60
    mode: BOX
    entity_category: CONFIG
    optimistic: true
    restore_value: true
    initial_value: 5

switch:

  # Master enable for the accelerometer-based vibration stall check. When OFF
  # the 200 ms vibration interval short-circuits — only TMC2209 StallGuard
  # remains as a stall safeguard. Defaults OFF because the thresholds need
  # tuning per installation and a misconfigured detector trips spurious stops.
  # Turning OFF resets the loud-sample counter so a future re-enable starts
  # fresh.
  - platform: template
    name: "Vibration Stall Detection"
    id: vib_enabled
    entity_category: CONFIG
    web_server:
      sorting_weight: 1
      sorting_group_id: group_stall
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_off_action:
      - globals.set:
          id: vib_loud_count
          value: "0"
    # Interlock: never both detectors off.
    on_turn_off:
      - if:
          condition:
            lambda: 'return id(stall_interlock_armed) && !id(stallguard_enabled).state;'
          then:
            - logger.log:
                level: WARN
                format: "Vibration Stall Detection stays on - StallGuard is off, and one stall detector must stay on"
            - switch.turn_on: vib_enabled
          else:
            - logger.log: "Vibration stall detection disabled"

  # Master enable for the TMC2209 StallGuard *handler*. The chip's SGTHRS is
  # always set to the user's chosen value (via the SGTHRS number entity), so
  # the chip detects stalls regardless of this switch. The on_stall handler
  # on the stepper is what's gated by this switch — when OFF, stall events
  # fire but are ignored. Defaults ON: it is the backstop that stops the motor
  # if a limit switch dies before the open stroke has been learned. A unit that
  # already stored a setting keeps it. Note the chip only reports stalls while
  # TSTEP <= TCOOLTHRS: core's default TCOOLTHRS (100) arms it only near Fast
  # until an auto-calibration sets TCOOLTHRS from the measured cruise TSTEP.
  - platform: template
    name: "StallGuard Enabled"
    id: stallguard_enabled
    entity_category: CONFIG
    web_server:
      sorting_weight: 1
      sorting_group_id: group_sg_adv
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - logger.log: "StallGuard handler enabled"
    # Interlock: never both detectors off.
    on_turn_off:
      - if:
          condition:
            lambda: 'return id(stall_interlock_armed) && !id(vib_enabled).state;'
          then:
            - logger.log:
                level: WARN
                format: "StallGuard stays on - Vibration Stall Detection is off, and one stall detector must stay on"
            - switch.turn_on: stallguard_enabled
          else:
            - logger.log: "StallGuard handler disabled"

  # Self-healing StallGuard tune. When ON (and StallGuard + Vibration Stall
  # Detection are both on), the firmware cross-checks every StallGuard trip against
  # the accelerometer: it RAISES SGTHRS when vibration catches a stall StallGuard
  # missed, and LOWERS it after a run of quiet mid-travel trips that look like false
  # positives. Adjustments are ±1 register step at a time and clamped to a safe
  # band; each is logged and counted. Advanced/opt-in (default OFF) — it slowly
  # drifts a safety threshold, so enable it only once a baseline calibration is
  # trusted. A fresh Auto-Calibrate always overrides whatever it has drifted to.
  - platform: template
    name: "StallGuard Auto-Tune"
    id: sg_autotune
    entity_category: CONFIG
    web_server:
      sorting_weight: 7
      sorting_group_id: group_sg_adv
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - logger.log: "StallGuard auto-tune enabled"
    turn_off_action:
      - logger.log: "StallGuard auto-tune disabled"

button:

  # --- Lifetime counter resets ---
  - platform: template
    name: "Reset StallGuard Trips"
    entity_category: DIAGNOSTIC
    web_server:
      sorting_weight: 14
      sorting_group_id: group_diagnostics
    on_press:
      - globals.set:
          id: stallguard_count
          value: "0"
      - logger.log: "StallGuard trip counter reset"

  - platform: template
    name: "Reset Vibration Stall Trips"
    entity_category: DIAGNOSTIC
    web_server:
      sorting_weight: 15
      sorting_group_id: group_diagnostics
    on_press:
      - globals.set:
          id: vib_stall_count
          value: "0"
      - logger.log: "Vibration stall trip counter reset"

# -----------------------------------------------------------------------------
# Diagnostic / live sensors
# -----------------------------------------------------------------------------
# Accelerometer x/y/z feed the anti-tamper and vibration-stall logic in the
# intervals at the bottom of the file. TSTEP / SG_RESULT are useful for tuning
# StallGuard sensitivity (drive the motor under load, watch SG_RESULT, set
# SGTHRS to about half of it). Motor temperature: packages/temperature.yaml.
sensor:
  # Core's SG_RESULT / TSTEP readouts are StallGuard-tuning diagnostics; move them
  # from core's Diagnostics group down into the advanced StallGuard group with the
  # SGTHRS/TCOOLTHRS registers they help tune.
  - id: !extend sen_sgresult
    web_server: { sorting_weight: 4, sorting_group_id: group_sg_adv }
  - id: !extend sen_tstep
    web_server: { sorting_weight: 5, sorting_group_id: group_sg_adv }

    # USE ALERT PIN IN FUTURE instead of polling

  # (WiFi Signal, Uptime and ESP Internal Temperature come from core.)

  # --- Lifetime event counters (persisted in flash) ---
  # Bump on each respective event; survive reboots. To zero them, you'd need
  # to add reset buttons or temporarily flip restore_value: no and reflash.
  - platform: template
    name: "StallGuard Trips"
    lambda: 'return id(stallguard_count);'
    update_interval: 30s
    entity_category: DIAGNOSTIC
    accuracy_decimals: 0
    web_server:
      sorting_weight: 11
      sorting_group_id: group_diagnostics
  - platform: template
    name: "Vibration Stall Trips"
    lambda: 'return id(vib_stall_count);'
    update_interval: 30s
    entity_category: DIAGNOSTIC
    accuracy_decimals: 0
    web_server:
      sorting_weight: 12
      sorting_group_id: group_diagnostics
  - platform: template
    name: "Auto-Tune Adjustments"
    lambda: 'return id(sg_autotune_count);'
    update_interval: 30s
    entity_category: DIAGNOSTIC
    accuracy_decimals: 0
    web_server:
      sorting_weight: 6
      sorting_group_id: group_sg_adv

script:

  # The response to a stall that stopped a motion, shared by the TMC2209
  # on_stall handler and the vibration-stall check (each has already stopped the
  # motor and counted the trip). Stall auto-release: the leadscrew is not
  # backdrivable, so a stall against an obstruction HOLDS whatever clamp force it
  # reached until the motor reverses; back off ~8 mm so "stops while still
  # clamping" becomes a genuine auto-reverse.
  #
  # The back-off is real movement, so it is reported as such: global_state and
  # the cover show the direction the motor is actually travelling until it
  # stops, and IDLE comes from the 200 ms completion poll on arrival (which also
  # saves the position). Showing IDLE here would let Button 1 read the moving
  # window as idle and start a close, back toward the obstruction.
  #
  # One release per event: stall_release_active stays set for the whole
  # back-off (cleared by the poll, motion_halt, or the next user move), so a
  # stall DURING the back-off just stops — jammed: don't oscillate back toward
  # the first stall. During calibration there is no back-off: the leg stops and
  # escalates on its own.
  - id: stall_response
    then:
      # A stall ends any learning open (item: learn only from a clean open) and
      # makes what follows a back-off, not an end-of-travel move.
      - lambda: |-
          id(learn_this_open) = false;
          id(homed_fresh) = false;
          id(open_to_end) = false;
          id(close_to_end) = false;
          // The count may be off by what the motor slipped: the next Close or Open
          // runs to its switch (seek_next; calibration legs end on the switches).
          if (!id(cal_active)) id(seek_next) = true;
      - if:
          condition:
            lambda: 'return !id(cal_active) && !id(stall_release_active);'
          then:
            - lambda: |-
                int32_t pos = id(driver)->current_position;
                int32_t rel = ${stall_release_steps};
                // Stalled while CLOSING (state 2): back off toward open.
                // Otherwise back off toward close.
                bool was_closing = (id(global_state) == 2);
                int32_t tgt = was_closing ? pos + rel : pos - rel;
                // Keep the target inside the travel: the limit switch must not
                // be the only thing that stops an over-travel.
                const int32_t stroke = id(open_stroke_steps) > 0 ? id(open_stroke_steps)
                                                                : (int32_t) (${open_default_mm} * ${steps_per_mm});
                if (tgt < 0) tgt = 0;
                if (tgt > stroke) tgt = stroke;
                id(stall_release_active) = true;
                id(motion_start_ms) = millis();   // vibration launch mask for the reversal
                id(vib_loud_count) = 0;           // the stall's judder is not new evidence
                id(global_current_position) = pos;
                id(global_state) = was_closing ? 1 : 2;
                id(driver)->set_target(tgt);
                ESP_LOGW("stall", "backing off to %d", (int) tgt);
            - if:
                condition:
                  lambda: 'return id(global_state) == 1;'
                then:
                  - cover.template.publish:
                      id: glasscalibur_cover
                      current_operation: OPENING
                else:
                  - cover.template.publish:
                      id: glasscalibur_cover
                      current_operation: CLOSING
          else:
            # Calibrating (the leg recovers on its own), or a stall during a
            # back-off (jammed): stay stopped.
            - script.execute: motion_halt
      # One "obstructed" event per stall that stops a motion, outside
      # calibration (calibration probes stall on purpose). A jam during the
      # back-off is a second stall, so it fires a second event.
      - if:
          condition:
            lambda: 'return !id(cal_active);'
          then:
            - event.trigger:
                id: obstruction_event
                event_type: obstructed

  # StallGuard auto-tune — lower-direction cross-check, run from the on_stall
  # handler. Records that StallGuard fired this move, then (only when the
  # "StallGuard Auto-Tune" switch is on and vibration detection is available)
  # decides whether the trip was real:
  #   - vibration agreed (peak >= half the Vibration Threshold)  -> real stall,
  #     the tune is fine; clear the quiet streak.
  #   - vibration stayed at free-run levels AND the trip was mid-travel (not near
  #     an end stop, where a decel/limit trip is expected) -> a probable false
  #     trip; bump the quiet streak. Only after THREE consecutive such trips —
  #     strong evidence of chronic over-sensitivity, since the accelerometer can
  #     miss a single fast stall — lower SGTHRS one step (harder to trip) and
  #     reset. Clamped to a safe floor. The raise direction lives in the vibration
  #     interval (it has the high-confidence signal). Small, bounded, opt-in, and
  #     every change is logged and counted.
  - id: sg_autotune_eval
    then:
      - lambda: |-
          id(sg_fired_this_move) = true;
          if (!id(sg_autotune).state || !id(vib_enabled).state) return;
          // Ignore trips near either end stop — a StallGuard trip as the sash
          // seats against a limit is expected, not a false positive.
          int32_t pos = id(driver)->current_position;
          const int32_t stroke = id(open_stroke_steps) > 0 ? id(open_stroke_steps)
                                                          : (int32_t) (${open_default_mm} * ${steps_per_mm});
          float frac = (float)pos / (float)stroke;
          if (frac < 0.05f || frac > 0.95f) return;
          float bar = 0.5f * id(vib_threshold).state;
          if (id(vib_run_peak) >= bar) {           // vibration agreed -> real stall
            id(sg_quiet_streak) = 0;
            return;
          }
          // Quiet mid-travel trip -> weak evidence of over-sensitivity.
          id(sg_quiet_streak) += 1;
          ESP_LOGI("sg_autotune", "quiet mid-travel StallGuard trip (%d/3), peak=%.3fg bar=%.3fg",
                   id(sg_quiet_streak), id(vib_run_peak), bar);
          if (id(sg_quiet_streak) >= 3) {
            int v = id(global_sgthrs) - 2;          // lower = less sensitive
            if (v < 2) v = 2;                       // safe floor
            if (v != id(global_sgthrs)) {
              id(global_sgthrs) = v;
              global_sgthrs->update();              // persist (restore_value global)
              id(driver)->write_register(SGTHRS, v);
              id(sg_autotune_count) += 1;
              ESP_LOGW("sg_autotune", "3 quiet trips -> lowering SGTHRS to %d (less sensitive)", v);
            }
            id(sg_quiet_streak) = 0;
          }

interval:

  # --- Vibration-based stall check. Only active while OPENING/CLOSING.
  #     A stalled stepper shakes the device hard. We measure
  #     |sqrt(x^2+y^2+z^2) - 1g| (orientation-independent vibration amplitude
  #     — gravity always has magnitude 1g regardless of how the device is
  #     mounted, so subtracting 1g leaves only the non-gravity component).
  #     If that exceeds vib_threshold for vib_stall_samples consecutive ticks,
  #     run the same stop+IDLE path as the TMC2209 on_stall handler.
  - interval: 200ms
    then:
      - if:
          condition:
            lambda: |-
              // Launch mask: the acceleration ramp shakes the device hard —
              // steppers pass through their resonance band at low step rates,
              // and the leadscrew takes up slack — so vibration there reads
              // like a stall on a perfectly healthy travel. A fixed 500 ms
              // was shorter than the ramp itself (speed/accel = 1 s at the
              // 1500/1500 defaults), which false-tripped ~2 s into every
              // move. Mask 500 ms + the time to reach cruise speed, capped
              // at 3 s so extreme speed/accel settings can't blind the
              // detector for a whole travel.
              if (!id(vib_enabled).state) return false;
              if (id(global_state) != 1 && id(global_state) != 2) return false;
              int acc = id(global_acceleration);
              if (acc < 1) acc = 1;
              uint32_t mask_ms = 500 + (uint32_t)(1000.0f * id(global_speed) / (float)acc);
              if (mask_ms > 3000) mask_ms = 3000;
              return (millis() - id(motion_start_ms)) >= mask_ms;
          then:
            - lambda: |-
                // The LIS2DH12 publishes every 500 ms but this interval ticks
                // every 200 ms, so the same cached sample used to be counted
                // 2-3 times — "5 consecutive samples" tripped on only ~2
                // distinct readings (~1 s), not the ~2.5 s of sustained
                // judder the debounce was designed for. Count each fresh
                // sensor sample exactly once; an unchanged x/y/z triple is
                // the same cached reading, not new evidence.
                static float last_x = 1e9f, last_y = 1e9f, last_z = 1e9f;
                float x = id(accel_x).state;
                float y = id(accel_y).state;
                float z = id(accel_z).state;
                if (x == last_x && y == last_y && z == last_z) return;
                last_x = x; last_y = y; last_z = z;
                // UNITS: the LIS2DH12 publishes m/s² (ESPHome convention);
                // every threshold in this config is in g. Normalize BEFORE
                // subtracting the 1 g gravity magnitude — without the
                // division this computes ≈9 "g" of vibration at rest, every
                // sample counts as loud, and any move is killed as soon as
                // the launch mask expires (this false-failed calibration).
                constexpr float G_MS2 = 9.80665f;
                float mag_g = sqrtf(x*x + y*y + z*z) / G_MS2;
                float vibration = fabsf(mag_g - 1.0f);
                // Track the peak vibration this travel for the StallGuard
                // auto-tune cross-check (see sg_autotune_eval).
                if (vibration > id(vib_run_peak)) id(vib_run_peak) = vibration;
                // Asymmetric leaky counter: +2 on loud, -1 on quiet
                // (floored at 0). A skipping stall's judder alternates
                // violent and quiet readings at this 500 ms sample cadence;
                // the old symmetric ±1 dithered near zero through a real
                // multi-second field stall and never tripped. With +2/-1,
                // loud-dominant sampling reaches the 5-sample default in
                // ~2 s while an isolated jolt (+2, then decay) still
                // cannot trip it.
                if (vibration > id(vib_threshold).state) {
                  id(vib_loud_count) += 2;
                } else if (id(vib_loud_count) > 0) {
                  id(vib_loud_count) -= 1;
                }
            - if:
                condition:
                  lambda: 'return id(vib_loud_count) >= (int)id(vib_stall_samples).state;'
                then:
                  - logger.log:
                      level: WARN
                      format: "VIBRATION STALL — strong vibration for %d samples"
                      args: ['id(vib_loud_count)']
                  - stepper.stop: driver
                  - lambda: 'id(vib_stall_count) += 1;'
                  # StallGuard auto-tune — RAISE direction (high confidence). The
                  # vibration detector needed sustained judder to trip, so this is
                  # a real stall. If StallGuard was armed but did NOT fire during
                  # this travel, it was too insensitive and missed it -> raise
                  # SGTHRS one step (easier to trip), clamped to a safe ceiling.
                  - if:
                      condition:
                        lambda: 'return id(sg_autotune).state && id(stallguard_enabled).state && !id(sg_fired_this_move);'
                      then:
                        - lambda: |-
                            int v = id(global_sgthrs) + 2;   // higher = more sensitive
                            if (v > 60) v = 60;              // safe ceiling for this device
                            if (v != id(global_sgthrs)) {
                              id(global_sgthrs) = v;
                              global_sgthrs->update();
                              id(driver)->write_register(SGTHRS, v);
                              id(sg_autotune_count) += 1;
                              id(sg_quiet_streak) = 0;
                              ESP_LOGW("sg_autotune", "vibration caught a stall StallGuard missed -> raising SGTHRS to %d", v);
                            }
                  # Back-off and state handling: stall_response (shared with
                  # the StallGuard on_stall handler). This path stays live
                  # during calibration — it is the calibration backstop.
                  - script.execute: stall_response
                  - globals.set:
                      id: vib_loud_count
                      value: "0"
          else:
            # Reset the counter whenever we're not commanded to move so the
            # next move starts fresh.
            - globals.set:
                id: vib_loud_count
                value: "0"
