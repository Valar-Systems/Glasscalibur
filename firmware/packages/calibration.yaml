# =============================================================================
# Glasscalibur - auto-calibration, its status and the uncalibrated speed lock
# =============================================================================
# A local package merged by firmware/glasscalibur.yaml. Its items moved
# verbatim from the former single product file.
# =============================================================================

globals:

  # (Sun-schedule globals — latitude/longitude/offsets/last-desired — are now
  # provided by the scheduling mixin.)

  # --- Auto-calibration + stall-release state (v1.3.0) ---
  # Live calibration state (not persisted — a reboot mid-cal starts clean).
  - id: cal_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: cal_sg_min
    type: int
    restore_value: no
    initial_value: '510'
  - id: cal_vib_max
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: cal_irun_index
    type: int
    restore_value: no
    initial_value: '0'
  - id: cal_done
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: cal_travel_ok
    type: bool
    restore_value: no
    initial_value: 'false'
  # Per-travel deadline: armed immediately before each calibration travel from
  # the LIVE speed (open_default_mm travel / global_speed × 1.5 + 10 s). A
  # fixed timeout cannot work here — travel time ranges from ~34 s (speed
  # 10000) to ~57 min (speed 100) — and the wait_until conditions below always
  # exit on software target arrival anyway (open-loop stepper: the 200 ms
  # completion poll drops global_state to 0), so the deadline is a backstop.
  - id: cal_t0_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: cal_budget_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # The user's Vibration Threshold as it was when calibration started, so a
  # failed/aborted run can put it back after probing with the raised
  # ${cal_vib_backstop}. Volatile: if the device reboots mid-calibration the
  # raised backstop persists in the number entity — still a working (just
  # laxer) detector; recalibrate to retune.
  - id: cal_vib_prev
    type: float
    restore_value: no
    initial_value: '0.30'
  # Escalation handshake between the 100 ms calibration sampler and cal_leg:
  # sustained SG_RESULT below ${cal_sg_floor} (torque margin starving) sets
  # cal_escalate so the leg bumps to the next current BEFORE a violent stall
  # develops. Reset at the start of every attempt.
  - id: cal_escalate
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: cal_sg_low_count
    type: int
    restore_value: no
    initial_value: '0'
  # Largest (= slowest) TSTEP seen at cruise during the validation leg.
  # Feeds TCOOLTHRS = 1.5 × cruise TSTEP on success: the TMC2209 only
  # asserts stalls while TSTEP < TCOOLTHRS, and the shipped default (100)
  # sat BELOW the ~150 cruise TSTEP at speed 2500 — StallGuard was
  # velocity-gated inert in normal operation until calibration derives
  # this properly.
  - id: cal_tstep_max
    type: int
    restore_value: no
    initial_value: '0'

  # Which calibration phase is running, so the status text can tell a
  # bystander that the homing close is deliberate (field 2026-07-10: a user
  # watching the window close right after starting calibration read it as a
  # malfunction and hit the abort button). 0 = none/generic, 1 = homing
  # close, 2 = open leg, 3 = close leg. Display-only; gated on cal_active.
  - id: cal_phase
    type: int
    restore_value: no
    initial_value: '0'

  # Persisted results (survive reboot, feed the "Calibration Status" sensor).
  # cal_result: 0 = never run, 1 = OK, 2 = OK w/ sticky-window warning,
  #             3 = FAILED (travel never reached both limits), 4 = thermal
  #             abort (motor exceeded 55 °C mid-run — see cal_thermal_guard),
  #             5 = aborted by user (Button 1)
  - id: cal_result
    type: int
    restore_value: yes
    initial_value: '0'
  - id: cal_irun_chosen
    type: int
    restore_value: yes
    initial_value: '0'
  - id: cal_sgthrs_chosen
    type: int
    restore_value: yes
    initial_value: '0'
  - id: cal_sgmin_seen
    type: int
    restore_value: yes
    initial_value: '0'
  - id: cal_vibmax_x100
    type: int
    restore_value: yes
    initial_value: '0'
  - id: cal_speed_at
    type: int
    restore_value: yes
    initial_value: '0'
  # Set when the calibration routine completes successfully on this unit; never
  # cleared (a later failed calibration keeps the last good one). Until it is
  # set, every move runs at the Fast preset (speed_fast), where the driver's
  # default StallGuard threshold can detect stalls. Persisted across reboots and
  # firmware updates. Units calibrated by an earlier firmware are recognised at
  # boot: cal_speed_at is written only by that same success branch.
  - id: sg_calibrated
    type: bool
    restore_value: yes
    initial_value: 'false'
  # The speed (steps/s) the last successful calibration ran at — the speed its
  # StallGuard tune is valid for. 0 = not recorded (never calibrated, or
  # calibrated by a firmware that did not record it: set at boot from the saved
  # speed setting). When the setting differs, moves run at this speed until a
  # calibration at the new setting succeeds (see effective_speed).
  - id: cal_speed
    type: int
    restore_value: yes
    initial_value: '0'

binary_sensor:

  # A calibration has completed successfully on this unit (sg_calibrated). Off:
  # every move runs at the Fast preset until one does.
  - platform: template
    name: "StallGuard calibrated"
    id: sg_calibrated_sensor
    entity_category: DIAGNOSTIC
    web_server:
      sorting_weight: 9
      sorting_group_id: group_diagnostics
    lambda: 'return id(sg_calibrated);'

button:

  # ("Update Firmware (GitHub)" and "Restart" come from core — core's GitHub-OTA
  # button already targets ${ota_repo}/${ota_asset} = Valar-Systems/Glasscalibur,
  # so the field OTA URL is byte-for-byte identical to what shipped.)

  # Start auto-calibration from the web UI / Home Assistant. Same entry point
  # as the GPIO21 double-click; all preconditions live in the script.
  - platform: template
    name: "Auto-Calibrate"
    entity_category: CONFIG
    web_server:
      sorting_weight: 1
      sorting_group_id: group_cal
    on_press:
      - script.execute: auto_calibrate

text_sensor:

  # Uncalibrated fail-safe notices (see sg_calibrated). The first sits at the top
  # of Control, the second right under the Speed select.
  - platform: template
    name: "Calibration Notice"
    id: cal_notice_text
    web_server:
      sorting_weight: 0
      sorting_group_id: group_control
    update_interval: 5s
    lambda: |-
      if (id(sg_calibrated)) return {"Calibrated"};
      return {"Not calibrated - run Calibrate"};
  - platform: template
    name: "Speed Lock"
    id: speed_lock_text
    web_server:
      sorting_weight: 1.5
      sorting_group_id: group_tuning
    update_interval: 5s
    lambda: |-
      if (!id(sg_calibrated)) return {"Speed locked to Fast until calibration has run"};
      const int cs = id(cal_speed);
      if (cs > 0 && id(global_speed) != cs) {
        // Name the calibrated speed: the preset when it is one, else the number.
        const char *name = cs == 1200 ? "Slow" : cs == 2600 ? "Medium" : cs == ${speed_fast} ? "Fast" : nullptr;
        char buf[96];
        if (name) snprintf(buf, sizeof(buf), "Speed change needs recalibration - running at %s (%d steps/s)", name, cs);
        else snprintf(buf, sizeof(buf), "Speed change needs recalibration - running at %d steps/s", cs);
        return {std::string(buf)};
      }
      return {"Not locked"};

  # (Firmware Version, Board, and the IP/SSID/MAC wifi_info sensors come from
  # core — core owns firmware_version_text and publishes it in on_boot.)

  # Calibration result, persisted across reboots. Appends STALE if Speed has
  # changed since calibration — SG_RESULT is speed-dependent, so a speed
  # change invalidates the StallGuard tune.
  - platform: template
    name: "Calibration Status"
    id: cal_status
    entity_category: DIAGNOSTIC
    web_server:
      sorting_weight: 2
      sorting_group_id: group_cal
    update_interval: 30s
    lambda: |-
      if (id(cal_active)) {
        switch (id(cal_phase)) {
          case 1: return {"Calibrating 1/3: closing to home position (normal)"};
          case 2: return {"Calibrating 2/3: opening - finding minimum current"};
          case 3: return {"Calibrating 3/3: closing - verifying"};
          default: return {"Calibrating - keep the window path clear"};
        }
      }
      char buf[120];
      switch (id(cal_result)) {
        case 1:
          snprintf(buf, sizeof(buf), "OK: irun=%d SGTHRS=%d (SGmin=%d, vib=%.2fg)",
                   id(cal_irun_chosen), id(cal_sgthrs_chosen),
                   id(cal_sgmin_seen), id(cal_vibmax_x100) / 100.0f);
          break;
        case 2:
          snprintf(buf, sizeof(buf), "OK (STICKY WINDOW): irun=%d SGTHRS=%d (SGmin=%d)",
                   id(cal_irun_chosen), id(cal_sgthrs_chosen), id(cal_sgmin_seen));
          break;
        case 3:
          return {"FAILED - window did not reach limits. Check track."};
        case 4:
          return {"FAILED - motor overheated mid-run. Cool 15 min, re-run."};
        case 5:
          return {"Aborted by user - run calibration again"};
        default:
          return {"Not calibrated"};
      }
      std::string s = buf;
      // STALE against the calibrated speed now in force (cal_speed): moves run at
      // that speed until a calibration at the new setting succeeds.
      if (id(cal_speed) != 0 && id(cal_speed) != id(global_speed)) {
        s += " | STALE - speed changed, recalibrate";
      }
      return {s};

script:

  # End a running calibration in its ship-safe posture: both stall detectors on,
  # the user's vibration threshold back, rated current, result 5 ("Aborted by
  # user"). It does not move the motor: stop_action halts first; a user
  # Open / Close / Set-position starts its own move after it.
  - id: cal_abort
    then:
      - script.stop: auto_calibrate
      - script.stop: cal_leg
      - switch.turn_on: stallguard_enabled
      - switch.turn_on: vib_enabled
      # Put back the vibration threshold the user had before the script raised
      # it to the calibration backstop.
      - number.set:
          id: vib_threshold
          value: !lambda 'return id(cal_vib_prev);'
      - globals.set:
          id: cal_active
          value: 'false'
      - globals.set:
          id: cal_result
          value: '5'
      # The aborted probe may have left a mid-search candidate (e.g. 12) in the
      # driver — restore the rated current.
      - globals.set:
          id: global_irun
          value: '19'
      - tmc2209.currents:
          irun: !lambda 'return id(global_irun);'
      - logger.log: "CAL: aborted by user"
      - script.execute: cal_beep_fail
      - component.update: cal_status
      - script.execute:
          id: cal_keep_last_good
          reason: "calibration aborted by user"

  # ===========================================================================
  # Auto-calibration (v1.3.0)
  # ===========================================================================
  # Finds the lowest reliable motor current and tunes both stall detectors to
  # this specific window, using the physical limit switches as ground truth.
  #
  #   1. Refuse when busy, tampered, already calibrating, during the thermal
  #      lockout, or when the motor is hot (> thermal_warn_c, 50 °C) or its
  #      temperature is NAN — sensor absent means thermal protection absent;
  #      refuse, never ignore.
  #   2. Announce: 3 beeps + 2 s stand-clear pause before ANY motion.
  #   3. Detector posture: StallGuard REACTION off (SGTHRS is the thing being
  #      tuned — a stale threshold would false-abort every probe). The
  #      vibration detector is forced ON as the backstop — it defaults OFF
  #      from the factory, so without the explicit turn-on a fresh unit would
  #      probe with no stall protection at all — and its threshold is raised
  #      to at least ${cal_vib_backstop} g for the duration (the user's value
  #      may itself be mistuned; it is one of calibration's outputs). A truly
  #      stalled probe still shakes far harder than that and fails in
  #      seconds instead of riding out the travel deadline.
  #   4. Home to the close limit at irun 19 (rated 0.6 A). The saved position
  #      can lie (skipped steps, stale flash), so homing first claims
  #      position = full-open: the close command then always covers the whole
  #      travel and the limit switch re-syncs position to 0 on arrival.
  #   5. Single-pass search (see cal_leg): ONE open travel escalating in
  #      place up the ladder {12, 15, 17, 19} — on vibration stall, SG
  #      margin starvation, silent step loss, or deadline, bump to the next
  #      current and resume from where it stopped — then ONE close travel
  #      validating the settled current over the full distance (escalating
  #      further if friction is direction-dependent). Success oracle = the
  #      LIMIT SWITCHES, never the step counter: an open-loop stepper that
  #      skipped steps still "arrives" at its software target, so every
  #      attempt re-claims a full travel of commanded distance. Each
  #      attempt gets a deadline computed from the LIVE speed
  #      (open_default_mm travel / global_speed × 1.5 + 10 s); a fixed
  #      timeout cannot work — a full travel is ≈228 s at the default
  #      1500 steps/s and speed is user-tunable 100..10000. A spot that
  #      still stalls at 19 exhausts the ladder and fails the run: never
  #      muscle through what might be an obstruction.
  #   6. Outcome: SGTHRS = SGmin/4 — trip level (2×SGTHRS) = half the worst
  #      legitimate reading. NEVER SGmin/2: that puts the trip level AT the
  #      worst legitimate load and false-stalls instantly (the original
  #      tuning bug). Vibration Threshold = 3 × free-run max, clamped
  #      [0.15, 0.45] g.
  #   7. EVERY exit path (success, fail, homing bail-out, thermal stop, user
  #      abort via cal_abort) re-enables BOTH detectors — ship-safe posture.
  #
  # Abort: the cover's STOP from any source — web UI, Home Assistant, the API,
  # Button 1 single-click (checked BEFORE Child Lock: stopping an autonomous
  # multi-travel sequence is a safety control, never lockable) — or a user
  # Open / Close / Set-position. All of them go through cal_abort.
  # ===========================================================================
  - id: auto_calibrate
    mode: single
    then:
      # ---- 1. Preconditions ------------------------------------------------
      - if:
          condition:
            lambda: 'return id(global_state) != 0 || id(tamper_detected) || id(cal_active);'
          then:
            - logger.log: "CAL: refused - busy, tampered, or already calibrating"
            - script.stop: auto_calibrate
      - if:
          condition:
            lambda: 'return id(thermal_lockout);'
          then:
            - logger.log:
                level: WARN
                format: "CAL: refused - thermal lockout (clears below %.0f degC)"
                args: ['(float) ${thermal_clear_c}']
            - script.stop: auto_calibrate
      - if:
          condition:
            lambda: 'return isnan(id(motor_temp).state) || id(motor_temp).state > ${thermal_warn_c};'
          then:
            - logger.log:
                level: WARN
                format: "CAL: refused - motor temp %.1f degC (limit %.0f, NAN = sensor absent)"
                args: ['id(motor_temp).state', '(float) ${thermal_warn_c}']
            - script.stop: auto_calibrate

      - logger.log: "CAL: starting - keep the window path clear"
      - globals.set:
          id: cal_active
          value: 'true'
      # Capture the user's vibration threshold before anything can abort, so an
      # abort even during the announce puts back the right value.
      - lambda: 'id(cal_vib_prev) = id(vib_threshold).state;'
      - globals.set:
          id: cal_done
          value: 'false'
      - globals.set:
          id: cal_irun_index
          value: '0'
      - globals.set:
          id: cal_result
          value: '0'
      - globals.set:
          id: cal_phase
          value: '0'
      - component.update: cal_status

      # ---- 2. Announce: 3 beeps + 2 s stand-clear, before any motion -------
      - repeat:
          count: 3
          then:
            - output.ledc.set_frequency:
                id: buzzer
                frequency: "2700Hz"
            - output.set_level:
                id: buzzer
                level: "50%"
            - delay: 120ms
            - output.turn_off: buzzer
            - delay: 120ms
      - delay: 2s

      # ---- 3. Detector posture ---------------------------------------------
      # Vibration on BEFORE StallGuard off: the stall-detector interlock refuses
      # to switch StallGuard off while vibration is off.
      - switch.turn_on: vib_enabled
      - switch.turn_off: stallguard_enabled
      - number.set:
          id: vib_threshold
          value: !lambda |-
            float v = id(vib_threshold).state;
            float b = ${cal_vib_backstop};
            return (v > b) ? v : b;

      # ---- 4. Home to the close limit at full allowed current --------------
      - globals.set:
          id: cal_phase
          value: '1'
      - component.update: cal_status
      - globals.set:
          id: global_irun
          value: '19'
      - tmc2209.currents:
          irun: !lambda 'return id(global_irun);'
      - if:
          condition:
            binary_sensor.is_off: limit_switch_2
          then:
            # Re-claim a full open travel so the close drives all the way to S5
            # (or close_overtravel_mm past where zero would be).
            - stepper.report_position:
                id: driver
                position: !lambda |-
                  return id(open_stroke_steps) > 0
                      ? id(open_stroke_steps) + (int32_t) (${open_margin_mm} * ${steps_per_mm})
                      : (int32_t) (${open_default_mm} * ${steps_per_mm});
            - lambda: |-
                int spd = id(global_speed);
                if (spd < 100) spd = 100;
                id(cal_budget_ms) = (uint32_t)(1000.0f * (${open_default_mm} * ${steps_per_mm}) / (float)spd * 1.5f) + 10000;
                id(cal_t0_ms) = millis();
            - script.execute: drive_close
            - wait_until:
                condition:
                  lambda: |-
                    return id(limit_switch_2).state || id(global_state) == 0 ||
                           (millis() - id(cal_t0_ms)) > id(cal_budget_ms);
      - if:
          condition:
            binary_sensor.is_off: limit_switch_2
          then:
            # Could not even home — bail out safe.
            - script.execute: motion_halt
            - globals.set:
                id: cal_result
                value: '3'
            - number.set:
                id: vib_threshold
                value: !lambda 'return id(cal_vib_prev);'
            - switch.turn_on: stallguard_enabled
            - switch.turn_on: vib_enabled
            - globals.set:
                id: cal_active
                value: 'false'
            - logger.log:
                level: WARN
                format: "CAL: FAILED - could not reach the close limit"
            - script.execute: cal_beep_fail
            - component.update: cal_status
            - script.execute:
                id: cal_keep_last_good
                reason: "calibration failed - could not reach the close limit"
            - script.stop: auto_calibrate

      # ---- 5. Single-pass search: escalate in place up {12, 15, 17, 19} ---
      # One open travel + one close travel total. The open leg starts at the
      # lowest candidate and, on trouble (vibration stall, SG margin
      # starvation, silent step loss, deadline), bumps to the next current
      # and RESUMES from where it stopped — the limit switches remain the
      # only success oracle. The close leg then validates the settled
      # current over a full travel (friction can be direction-dependent),
      # escalating further if it must. Replaces the 4-probe × full-travel
      # search: ~2 travels instead of up to 11, which matters on an 80 g
      # motor that reached 61.5 °C mid-search in field testing.
      - globals.set:
          id: cal_irun_index
          value: '0'
      - script.execute:
          id: cal_leg
          opening: true
      - script.wait: cal_leg
      - if:
          condition:
            lambda: 'return id(cal_travel_ok);'
          then:
            # cal_irun_index deliberately carries over: the close leg starts
            # at the current the open leg settled on.
            - script.execute:
                id: cal_leg
                opening: false
            - script.wait: cal_leg
      - lambda: |-
          // cal_travel_ok now reflects the close leg (or stayed false if
          // the open leg exhausted the ladder). SG starvation escalates
          // DURING a leg, so completing at a sub-cap current implies
          // margin by construction; only a run that needed the full 19
          // with a thin observed minimum is flagged sticky (nothing higher
          // is allowed: 19 = rated 0.6 A against a 60 °C case limit).
          if (id(cal_travel_ok)) {
            id(cal_done) = true;
            id(cal_result) =
                (id(global_irun) == 19 && id(cal_sg_min) < ${cal_sg_floor}) ? 2 : 1;
          }

      # ---- 6. Outcome -------------------------------------------------------
      - if:
          condition:
            lambda: 'return id(cal_done);'
          then:
            - lambda: |-
                // SGTHRS = SGmin/4 -> trip level (2*SGTHRS) = half the worst
                // legitimate reading. NEVER SGmin/2 (trip level AT the worst
                // legitimate load = instant false stalls). Clamp to a sane
                // register range. SGmin==510 means the leg somehow gathered
                // no samples — keep the previous threshold rather than
                // tuning from an empty bucket (belt-and-braces; leg-level
                // accumulators make this near-impossible).
                int sgthrs = id(global_sgthrs);
                if (id(cal_sg_min) < 510) {
                  sgthrs = id(cal_sg_min) / 4;
                  if (sgthrs < 4)   sgthrs = 4;
                  if (sgthrs > 120) sgthrs = 120;
                }
                id(global_sgthrs)     = sgthrs;
                id(cal_sgthrs_chosen) = sgthrs;
                id(cal_irun_chosen)   = id(global_irun);
                id(cal_sgmin_seen)    = id(cal_sg_min);
                id(cal_vibmax_x100)   = (int)(id(cal_vib_max) * 100.0f);
                id(cal_speed_at)      = id(global_speed);
                // Calibrated on this unit: the user's speed applies from now on
                // (never cleared by a later failed calibration).
                id(sg_calibrated)     = true;
                // The tune is valid for this speed; moves run at it until a
                // calibration at another speed succeeds.
                id(cal_speed)         = id(global_speed);
                // Arm StallGuard at the operating speed: the chip only
                // asserts stalls while TSTEP < TCOOLTHRS, so derive the
                // threshold from measured cruise TSTEP (×1.5 keeps the
                // acceleration ramp gated off, where SG readings false-
                // trip). The old fixed default (100) was BELOW cruise
                // TSTEP — StallGuard never fired in normal operation.
                if (id(cal_tstep_max) > 0) {
                  int tc = (id(cal_tstep_max) * 3) / 2;
                  if (tc > 1048575) tc = 1048575;
                  id(global_tcoolthrs) = tc;
                }
            - lambda: 'id(driver)->write_register(TCOOLTHRS, id(global_tcoolthrs));'
            - tmc2209.stallguard:
                threshold: !lambda 'return id(global_sgthrs);'
            # Vibration threshold = 3x the free-run maximum seen during the
            # winning probe, clamped [0.15, 0.45] g. Replaces the raised
            # calibration backstop AND whatever the user had before.
            - number.set:
                id: vib_threshold
                value: !lambda |-
                  float v = 3.0f * id(cal_vib_max);
                  if (v < 0.15f) v = 0.15f;
                  if (v > 0.45f) v = 0.45f;
                  return v;
            - logger.log:
                format: "CAL: done. irun=%d SGTHRS=%d SGmin=%d vib_free=%.2fg TCOOLTHRS=%d"
                args: ['id(cal_irun_chosen)', 'id(cal_sgthrs_chosen)',
                       'id(cal_sgmin_seen)', 'id(cal_vib_max)', 'id(global_tcoolthrs)']
            - script.execute: cal_beep_ok
          else:
            - globals.set:
                id: cal_result
                value: '3'
            # Failed: put the user's vibration threshold back (a successful
            # run replaces it with the tuned value instead).
            - number.set:
                id: vib_threshold
                value: !lambda 'return id(cal_vib_prev);'
            - logger.log:
                level: WARN
                format: "CAL: FAILED - window never reached both limits"
            - script.execute: cal_beep_fail

      # ---- 7. Always: ship-safe posture -------------------------------------
      - switch.turn_on: stallguard_enabled
      - switch.turn_on: vib_enabled
      - globals.set:
          id: cal_active
          value: 'false'
      - component.update: cal_status
      # Speed: success -> the user's speed (sg_calibrated is now set); failure
      # -> keep the last good calibration (or stay locked to Fast) and say why.
      - if:
          condition:
            lambda: 'return id(cal_done);'
          then:
            - stepper.set_speed:
                id: driver
                speed: !lambda "return ${effective_speed};"
            - logger.log: "CAL: StallGuard calibrated - the speed setting applies"
            - component.update: speed_lock_text
            - component.update: cal_notice_text
          else:
            - script.execute:
                id: cal_keep_last_good
                reason: "calibration failed - window never reached both limits"

  # Every calibration exit other than success (could not home, never reached both
  # limits, too hot, aborted by user). The last good calibration stays: its
  # SGTHRS / TCOOLTHRS were only ever written by a successful run and
  # sg_calibrated is never cleared; its chosen motor current is put back (a
  # failed search can leave a lower candidate in the driver). An uncalibrated
  # unit stays locked to Fast at rated current. Logged at WARN with the reason.
  - id: cal_keep_last_good
    mode: queued
    parameters:
      reason: string
    then:
      - lambda: |-
          if (id(sg_calibrated)) {
            if (id(cal_irun_chosen) > 0) id(global_irun) = id(cal_irun_chosen);
            ESP_LOGW("cal", "CAL: %s - keeping the last good calibration "
                     "(irun=%d SGTHRS=%d TCOOLTHRS=%d, calibrated speed %d steps/s)", reason.c_str(),
                     id(global_irun), id(global_sgthrs), id(global_tcoolthrs), id(cal_speed));
          } else {
            id(global_irun) = 19;
            ESP_LOGW("cal", "CAL: %s - unit stays uncalibrated; speed stays locked to Fast",
                     reason.c_str());
          }
      - tmc2209.currents:
          irun: !lambda 'return id(global_irun);'
      - stepper.set_speed:
          id: driver
          speed: !lambda "return ${effective_speed};"
      - component.update: speed_lock_text
      - component.update: cal_notice_text

  - id: cal_beep_ok
    mode: single
    then:
      - output.ledc.set_frequency:
          id: buzzer
          frequency: "2700Hz"
      - output.set_level:
          id: buzzer
          level: "50%"
      - delay: 120ms
      - output.turn_off: buzzer
      - delay: 120ms
      - output.set_level:
          id: buzzer
          level: "50%"
      - delay: 120ms
      - output.turn_off: buzzer

  - id: cal_beep_fail
    mode: single
    then:
      - repeat:
          count: 3
          then:
            - output.ledc.set_frequency:
                id: buzzer
                frequency: "1400Hz"
            - output.set_level:
                id: buzzer
                level: "50%"
            - delay: 400ms
            - output.turn_off: buzzer
            - delay: 150ms

  # Mid-run thermal guard for auto_calibrate. The 50 °C precondition only
  # runs once at start; a full search is up to ~11 travels and field testing
  # showed 49 °C at start → 55.9 °C three probes in. Called before every
  # calibration travel, and by the thermal lockout: above thermal_start_max_c
  # (55 °C), NAN (no sensor means no protection) or during the lockout,
  # it stops the whole sequence with the same ship-safe cleanup as every
  # other exit path. 55 = 5 °C of margin under the motor's 60 °C datasheet
  # case limit.
  - id: cal_thermal_guard
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return id(cal_active) &&
                     (id(thermal_lockout) || isnan(id(motor_temp).state) ||
                      id(motor_temp).state > ${thermal_start_max_c});
          then:
            - logger.log:
                level: WARN
                format: "CAL: thermal stop - motor %.1f degC (limit %.0f%s). Cool down, then re-run."
                args: ['id(motor_temp).state', '(float) ${thermal_start_max_c}', 'id(thermal_lockout) ? ", thermal lockout" : ""']
            - script.execute: motion_halt
            - globals.set:
                id: cal_result
                value: '4'
            - number.set:
                id: vib_threshold
                value: !lambda 'return id(cal_vib_prev);'
            - switch.turn_on: stallguard_enabled
            - switch.turn_on: vib_enabled
            - globals.set:
                id: cal_active
                value: 'false'
            - script.execute: cal_beep_fail
            - component.update: cal_status
            - script.execute:
                id: cal_keep_last_good
                reason: "calibration stopped - motor too hot"
            # Must be last: kill the running leg, then the main sequence
            # (auto_calibrate is parked in script.wait: cal_leg).
            - script.stop: cal_leg
            - script.stop: auto_calibrate

  # One calibration travel ("leg") with in-place current escalation.
  # opening=true drives close→open (success oracle: limit_switch_1);
  # opening=false drives open→close (oracle: limit_switch_2). Each attempt
  # runs at CANDIDATES[cal_irun_index] and the leg climbs the ladder when:
  #   * the vibration detector declares a stall (it stops the motor and
  #     drops global_state to 0; there is no auto-release back-off during
  #     calibration — the leg itself re-claims a full travel),
  #   * the sampler reports SG margin starvation (cal_escalate — escalates
  #     while still moving, before a violent stall develops),
  #   * the software step count "arrives" without the switch (silent step
  #     loss — vibration alone misses this), or
  #   * the per-attempt deadline expires.
  # Every attempt re-claims a FULL travel of commanded distance, so a lying
  # step counter can never end a leg — only the physical switch can.
  # Exhausting the ladder leaves cal_travel_ok false; the caller decides
  # what that means. Only ever executed from auto_calibrate.
  - id: cal_leg
    mode: single
    parameters:
      opening: bool
    then:
      - globals.set:
          id: cal_travel_ok
          value: 'false'
      - globals.set:
          id: cal_phase
          value: !lambda 'return opening ? 2 : 3;'
      - component.update: cal_status
      - lambda: |-
          // LEG-level tune accumulators. SGTHRS / vibration threshold /
          // TCOOLTHRS are tuned from the close (validation) leg's stats,
          // which resets them here and owns them for its whole travel.
          // They must NOT reset per attempt: a leg that escalates moments
          // before the switch leaves zero unmasked samples at the final
          // current — that shipped SGmin=510 -> SGTHRS=120 (trip level
          // above normal cruise readings) in field testing. Sub-final-
          // current samples in the mix only bias SGTHRS low = fewer false
          // trips, never more.
          id(cal_sg_min) = 510;
          id(cal_vib_max) = 0.0f;
          id(cal_tstep_max) = 0;
      - while:
          condition:
            lambda: |-
              bool sw = opening ? id(limit_switch_1).state : id(limit_switch_2).state;
              return !sw && id(cal_irun_index) < 4;
          then:
            - script.execute: cal_thermal_guard
            - lambda: |-
                static const int CANDIDATES[4] = {12, 15, 17, 19};
                id(global_irun) = CANDIDATES[id(cal_irun_index)];
                id(cal_escalate) = false;
                id(cal_sg_low_count) = 0;
            - tmc2209.currents:
                irun: !lambda 'return id(global_irun);'
            - logger.log:
                format: "CAL: %s leg at irun=%d"
                args: ['opening ? "open" : "close"', 'id(global_irun)']
            # Re-claim a full travel of commanded distance (the step counter
            # lies after a stall) and arm the speed-derived deadline.
            - lambda: |-
                const int32_t open_target = id(open_stroke_steps) > 0
                    ? id(open_stroke_steps) + (int32_t) (${open_margin_mm} * ${steps_per_mm})
                    : (int32_t) (${open_default_mm} * ${steps_per_mm});
                id(driver)->report_position(opening ? 0 : open_target);
                int spd = id(global_speed);
                if (spd < 100) spd = 100;
                id(cal_budget_ms) = (uint32_t)(1000.0f * (${open_default_mm} * ${steps_per_mm}) / (float)spd * 1.5f) + 10000;
                id(cal_t0_ms) = millis();
            - if:
                condition:
                  lambda: 'return opening;'
                then:
                  - script.execute: drive_open
                else:
                  - script.execute: drive_close
            - wait_until:
                condition:
                  lambda: |-
                    bool sw = opening ? id(limit_switch_1).state : id(limit_switch_2).state;
                    return sw || id(global_state) == 0 || id(cal_escalate) ||
                           (millis() - id(cal_t0_ms)) > id(cal_budget_ms);
            - if:
                condition:
                  lambda: 'return !(opening ? id(limit_switch_1).state : id(limit_switch_2).state);'
                then:
                  # No switch: stalled, starved, silently lost steps, or out
                  # of time. Stop (a starvation exit arrives here still
                  # moving) and climb to the next current. At the top of the
                  # ladder the while-condition ends the leg instead — a spot
                  # that still stalls at 19 is an obstruction or jam, never
                  # something to muscle through.
                  - script.execute: motion_halt
                  - lambda: 'id(cal_irun_index) += 1;'
                  - delay: 300ms
      - lambda: |-
          id(cal_travel_ok) =
              opening ? id(limit_switch_1).state : id(limit_switch_2).state;

interval:

  # (The sun-schedule poll now lives in the scheduling mixin's own 60 s interval,
  # which calls this product's schedule_open / schedule_close scripts.)

  # ---------------------------------------------------------------------------
  # Auto-calibration sampler
  # ---------------------------------------------------------------------------
  # Fast SG_RESULT / vibration sampler feeding the auto_calibrate script. Runs
  # only while calibrating, only while a travel is in progress, and only after
  # the launch mask (same ramp-aware mask as the vibration-stall detector,
  # +100 ms so the free-run baseline never includes ramp shake — a polluted
  # baseline would inflate the tuned Vibration Threshold toward its clamp).
  # cal_vib_max takes a running max, so the accelerometer's 500 ms cadence
  # only limits how often it can rise, not its correctness.
  - interval: 100ms
    then:
      - if:
          condition:
            lambda: |-
              if (!id(cal_active)) return false;
              if (id(global_state) != 1 && id(global_state) != 2) return false;
              // Only while actually driving toward the target. At software
              // arrival there is a ≤200 ms window before the completion
              // poll zeroes global_state, in which the motor has already
              // stopped: TSTEP decays toward its 1048575 idle ceiling and
              // SG_RESULT reads near zero. One tick inside that window
              // shipped TCOOLTHRS=37098 (mid-decay TSTEP × 1.5) and a fake
              // SGmin in field testing.
              if (id(driver)->current_position == id(driver)->target_position) return false;
              int acc = id(global_acceleration);
              if (acc < 1) acc = 1;
              uint32_t mask_ms = 600 + (uint32_t)(1000.0f * id(global_speed) / (float)acc);
              if (mask_ms > 3100) mask_ms = 3100;
              return (millis() - id(motion_start_ms)) > mask_ms;
          then:
            - lambda: |-
                // Cruise TSTEP (slowest sample survives) -> TCOOLTHRS on
                // success. 1048575 is the register's "stopped" value.
                int ts = id(driver)->read_register(TSTEP);
                if (ts > 0 && ts < 1048575 && ts > id(cal_tstep_max)) {
                  id(cal_tstep_max) = ts;
                }
                int sg = id(driver)->read_register(SG_RESULT);
                if (sg >= 0 && sg <= 510) {
                  if (sg < id(cal_sg_min)) id(cal_sg_min) = sg;
                  // Margin starvation -> escalate: net 8 low ticks below the
                  // floor asks cal_leg for the next current while the motor
                  // is still moving — earlier and quieter than a full
                  // vibration stall, and it bakes the margin requirement
                  // into the search itself. LEAKY counter (+1 low / -1
                  // high), NOT reset-on-good: a skipping stall oscillates
                  // SG_RESULT wildly sample-to-sample, and consecutive
                  // counting never accumulated during a real field stall —
                  // the motor ground at the jam until the step counter ran
                  // out instead.
                  if (sg < ${cal_sg_floor}) {
                    id(cal_sg_low_count) += 1;
                    if (id(cal_sg_low_count) >= 8) id(cal_escalate) = true;
                  } else if (id(cal_sg_low_count) > 0) {
                    id(cal_sg_low_count) -= 1;
                  }
                }
                float x = id(accel_x).state;
                float y = id(accel_y).state;
                float z = id(accel_z).state;
                if (!isnan(x) && !isnan(y) && !isnan(z)) {
                  // Sensor publishes m/s²; cal math (and the Vibration
                  // Threshold this feeds) is in g — normalize first.
                  constexpr float G_MS2 = 9.80665f;
                  float vib = fabsf(sqrtf(x*x + y*y + z*z) / G_MS2 - 1.0f);
                  if (vib > id(cal_vib_max)) id(cal_vib_max) = vib;
                }
