# =============================================================================
# Glasscalibur - motor temperature: warning, start gate and thermal lockout
# =============================================================================
# A local package merged by firmware/glasscalibur.yaml. The thresholds are the
# thermal_* substitutions there (warn 50, start gate 55, lockout 60, clear 48,
# no reading 15 s).
#
#   warn      a valid reading >= thermal_warn_c: log WARN + Thermal Alert
#             "warning", once until a reading below thermal_clear_c re-arms it.
#   start     no new motion starts while ${thermal_blocked} (the lockout, no
#   gate      valid reading, or >= thermal_start_max_c). The cover's open / close
#             / position actions and auto_calibrate check it first; every command
#             path (web UI, Home Assistant, the API, Button 1, schedules) reaches
#             the motor through those. STOP is never gated. A move already under
#             way is not stopped by the gate.
#   lockout   a valid reading >= thermal_lockout_c, or no valid reading for
#             thermal_stale_s (counted from boot until the first one): latch
#             thermal_lockout, stop motion (a stall back-off already running may
#             finish - it is the move that releases the clamp), end a running
#             calibration, chirp, fire Thermal Alert "lockout" / "sensor_lost".
#   clear     a valid reading below thermal_clear_c clears the lockout and fires
#             Thermal Alert "cleared".
#   refused   every thermal refusal (a cover command, a scheduled move, or
#             Auto-Calibrate) logs why and fires Thermal Alert "refused".
#   pending   a scheduled open / close the gate refused is kept (the latest one
#             wins) and runs once the motor reads below thermal_resume_c with the
#             gate open, if that happens within thermal_pending_s; otherwise it is
#             dropped and logged. A later accepted command or a STOP cancels it.
#             Manual commands are not retried.
#
# The latch is RAM only: a restart clears it, and the start gate then refuses
# until a valid reading under thermal_start_max_c arrives.
# =============================================================================

globals:
  # The thermal lockout latch (see above). Shown by "Thermal Lockout".
  - id: thermal_lockout
    type: bool
    restore_value: no
    initial_value: 'false'
  # The warning has fired; re-armed by a reading below thermal_clear_c.
  - id: thermal_warned
    type: bool
    restore_value: no
    initial_value: 'false'
  # millis() of the last valid (non-NAN) reading; 0 = none since boot.
  - id: thermal_last_ok_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # A scheduled move the start gate refused: 0 none, 1 open, 2 close; and when.
  - id: thermal_pending
    type: int
    restore_value: no
    initial_value: '0'
  - id: thermal_pending_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

sensor:

  # (SG_RESULT and TSTEP diagnostic sensors come from core — sen_sgresult /
  # sen_tstep. Scripts read the registers directly, so nothing here depends on
  # the product's former "… Sensor" copies.)

  - platform: tmp1075
    name: "Motor Temperature"
    id: motor_temp     # referenced by the start gate and the auto_calibrate temperature gate
    update_interval: 3s
    entity_category: DIAGNOSTIC
    web_server:
      sorting_weight: 7
      sorting_group_id: group_diagnostics
    i2c_id: i2c_bus
    address: 0x49
    accuracy_decimals: 2
    on_value:
      - lambda: |-
          if (isnan(x)) return;                       // not a valid reading
          id(thermal_last_ok_ms) = millis();
          if (x >= ${thermal_lockout_c}) {
            id(thermal_warned) = true;
            if (!id(thermal_lockout)) id(thermal_trip)->execute(1);
            return;
          }
          if (x < ${thermal_clear_c}) {
            id(thermal_warned) = false;
            if (id(thermal_lockout)) id(thermal_clear)->execute();
            return;
          }
          if (x >= ${thermal_warn_c} && !id(thermal_warned) && !id(thermal_lockout)) {
            id(thermal_warned) = true;
            id(thermal_warn)->execute();
          }
      # A pending scheduled move runs once the motor has cooled and the gate is open.
      - lambda: |-
          if (id(thermal_pending) == 0 || isnan(x) || x >= ${thermal_resume_c} || ${thermal_blocked}) return;
          const int w = id(thermal_pending);
          id(thermal_pending) = 0;
          if (!id(schedule_enabled).state) {
            ESP_LOGW("thermal", "Pending scheduled %s dropped - Schedule Enabled is off", w == 1 ? "open" : "close");
            return;
          }
          ESP_LOGW("thermal", "Motor %.1f degC - running the pending scheduled %s", x, w == 1 ? "open" : "close");
          if (w == 1) id(schedule_open)->execute();
          else        id(schedule_close)->execute();

binary_sensor:
  - platform: template
    name: "Thermal Lockout"
    id: thermal_lockout_sensor
    entity_category: DIAGNOSTIC
    web_server:
      sorting_weight: 7.5
      sorting_group_id: group_diagnostics
    lambda: 'return id(thermal_lockout);'

# Fires "warning", "lockout", "sensor_lost", "cleared" and "refused" (see the top
# of this file). Home Assistant automations can trigger on it directly.
event:
  - platform: template
    name: "Thermal Alert"
    id: thermal_event
    event_types: ["warning", "lockout", "sensor_lost", "cleared", "refused"]
    web_server:
      sorting_weight: 6
      sorting_group_id: group_control

script:
  # Latch the lockout. cause 1 = reading >= thermal_lockout_c, 2 = no valid
  # reading for thermal_stale_s.
  - id: thermal_trip
    parameters:
      cause: int
    then:
      - lambda: |-
          id(thermal_lockout) = true;
          if (cause == 2)
            ESP_LOGW("thermal", "THERMAL LOCKOUT - no valid motor temperature reading for %d s",
                     (int) ${thermal_stale_s});
          else
            ESP_LOGW("thermal", "THERMAL LOCKOUT - motor %.1f degC (limit %.0f); clears below %.0f degC",
                     id(motor_temp).state, (float) ${thermal_lockout_c}, (float) ${thermal_clear_c});
      - event.trigger:
          id: thermal_event
          event_type: !lambda 'return cause == 2 ? std::string("sensor_lost") : std::string("lockout");'
      # A running calibration ends as a thermal stop (its guard checks the latch).
      - script.execute: cal_thermal_guard
      # Stop any other motion, except a stall back-off already under way.
      - if:
          condition:
            lambda: |-
              const int s = id(global_state);
              return (s == 1 || s == 2) && !id(stall_release_active);
          then:
            - script.execute: motion_halt
      - script.execute: thermal_chirp

  - id: thermal_clear
    then:
      - globals.set:
          id: thermal_lockout
          value: 'false'
      - logger.log:
          level: WARN
          tag: thermal
          format: "Thermal lockout cleared - motor %.1f degC"
          args: ['id(motor_temp).state']
      - event.trigger:
          id: thermal_event
          event_type: cleared

  - id: thermal_warn
    then:
      - logger.log:
          level: WARN
          tag: thermal
          format: "Motor %.1f degC - at or above the warning level (%.0f)"
          args: ['id(motor_temp).state', '(float) ${thermal_warn_c}']
      - event.trigger:
          id: thermal_event
          event_type: warning

  # Logs why a cover command was refused by the start gate.
  - id: thermal_refused
    parameters:
      what: string
    then:
      - lambda: |-
          if (id(thermal_lockout))
            ESP_LOGW("thermal", "%s refused - thermal lockout (clears below %.0f degC)",
                     what.c_str(), (float) ${thermal_clear_c});
          else if (isnan(id(motor_temp).state))
            ESP_LOGW("thermal", "%s refused - no valid motor temperature reading", what.c_str());
          else
            ESP_LOGW("thermal", "%s refused - motor %.1f degC (no new moves at or above %.0f)",
                     what.c_str(), id(motor_temp).state, (float) ${thermal_start_max_c});
      - event.trigger:
          id: thermal_event
          event_type: refused

  # A scheduled move the gate refused: logged and announced as any refusal, then
  # kept pending (the latest one wins; the time limit restarts). which: 1 open,
  # 2 close.
  - id: thermal_hold_scheduled
    parameters:
      which: int
    then:
      - script.execute:
          id: thermal_refused
          what: !lambda 'return which == 1 ? std::string("Scheduled open") : std::string("Scheduled close");'
      - lambda: |-
          id(thermal_pending) = which;
          id(thermal_pending_ms) = millis();
          ESP_LOGW("thermal", "Scheduled %s kept pending - it runs once the motor reads below %.0f degC, "
                   "if that happens within %d min", which == 1 ? "open" : "close",
                   (float) ${thermal_resume_c}, (int) (${thermal_pending_s} / 60));

  # A later accepted command or a STOP cancels a pending scheduled move.
  - id: thermal_cancel_pending
    then:
      - lambda: |-
          if (id(thermal_pending) == 0) return;
          ESP_LOGI("thermal", "Pending scheduled %s cancelled by a newer command",
                   id(thermal_pending) == 1 ? "open" : "close");
          id(thermal_pending) = 0;

  # Four short high chirps, distinct from the calibration beeps and the tamper
  # alarm.
  - id: thermal_chirp
    mode: single
    then:
      - repeat:
          count: 4
          then:
            - output.ledc.set_frequency:
                id: buzzer
                frequency: "3200Hz"
            - output.set_level:
                id: buzzer
                level: "50%"
            - delay: 60ms
            - output.turn_off: buzzer
            - delay: 60ms

interval:
  # No valid reading for thermal_stale_s (counted from boot until the first
  # one) -> the same lockout; and the pending scheduled move's time limit.
  # 500 ms: a period no other interval uses.
  - interval: 500ms
    then:
      - lambda: |-
          if (!id(thermal_lockout) &&
              millis() - id(thermal_last_ok_ms) >= (uint32_t) ${thermal_stale_s} * 1000UL)
            id(thermal_trip)->execute(2);
      # A pending scheduled move that waited thermal_pending_s is dropped.
      - lambda: |-
          if (id(thermal_pending) != 0 &&
              millis() - id(thermal_pending_ms) >= (uint32_t) ${thermal_pending_s} * 1000UL) {
            ESP_LOGW("thermal", "Pending scheduled %s dropped - the motor did not read below %.0f degC "
                     "within %d min", id(thermal_pending) == 1 ? "open" : "close",
                     (float) ${thermal_resume_c}, (int) (${thermal_pending_s} / 60));
            id(thermal_pending) = 0;
          }
