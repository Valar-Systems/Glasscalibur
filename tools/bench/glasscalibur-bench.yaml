# =============================================================================
# BENCH ONLY — never flash this to a customer unit. Never built by CI or a release.
# =============================================================================
# The Glasscalibur release firmware plus one test button, "BENCH: simulate
# stall", for the bench checks in
# tools/regression-gate/predictions/2026-10-field-hardening.md (B3): StallGuard
# does not fire on cue, so the button runs the stall response on demand. It acts
# only while the cover is moving and does what the TMC2209 on_stall handler does:
# stop the motor, then stall_response. The release targets never include it.
packages:
  glasscalibur: !include ../../firmware/glasscalibur.yaml

button:
  - platform: template
    name: "BENCH: simulate stall"
    on_press:
      - if:
          condition:
            lambda: 'int s = id(global_state); return s == 1 || s == 2;'
          then:
            - stepper.stop: driver
            - logger.log: "BENCH: simulated stall"
            - script.execute: stall_response

# Simulated dead limit switch for L3 / L4 (the switches are soldered to the board, so they
# can't be unplugged). While a BENCH switch is on, its limit sensor reads released whatever
# the pin does - what a broken switch or cracked joint reads with a pull-up on the board.
# The filter is appended after the product's own filters, which stay unchanged. Turn it on
# only while that limit switch is released: a binary sensor re-evaluates on a pin change.
switch:
  - platform: template
    name: "BENCH: open switch (S4) dead"
    id: bench_s4_dead
    entity_category: CONFIG
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    name: "BENCH: close switch (S5) dead"
    id: bench_s5_dead
    entity_category: CONFIG
    optimistic: true
    restore_mode: ALWAYS_OFF
  # The same, kept across a restart (2.3.0 bench PC4: a unit saved as closed that
  # boots with S5 reading released). Turn it off afterwards.
  - platform: template
    name: "BENCH: close switch (S5) dead, kept across restarts"
    id: bench_s5_dead_kept
    entity_category: CONFIG
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:
  - id: !extend limit_switch_1
    filters:
      - lambda: 'if (id(bench_s4_dead).state) return false; return x;'
  - id: !extend limit_switch_2
    filters:
      - lambda: 'if (id(bench_s5_dead).state || id(bench_s5_dead_kept).state) return false; return x;'
